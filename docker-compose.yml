services:
  postgres:
    image: postgres:16-alpine
    container_name: av-erp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: averp
      POSTGRES_PASSWORD: averp
      POSTGRES_DB: av_erp
    ports:
      - "5432:5432"
    volumes:
      - av_erp_pgdata:/var/lib/postgresql/data
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U averp -d av_erp"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  av_erp_pgdata:
